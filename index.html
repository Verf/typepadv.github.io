<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>形码练习平台</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=37-74ee742">
  <link rel="stylesheet" href="assets/vendor/pico.min.css?v=37-74ee742">
  <link rel="stylesheet" href="assets/css/style.css?v=37-74ee742">
</head>
<body>
  <div class="app-layout">
    <!-- ===== 左侧栏 ===== -->
    <aside class="sidebar">
      <header class="app-header">
        <h1>形码练习平台</h1>
        <p class="subtitle">从字根记忆到文章跟打</p>
      </header>

      <!-- 实时统计（左上） -->
      <section id="stats-section" class="panel">
        <div class="panel-title">实时统计</div>
        <div class="stats-grid">
          <div class="stat"><span class="stat-label">用时</span><span class="stat-value stat-time" id="stat-time">0.0s</span></div>
          <div class="stat"><span class="stat-label">KPM</span><span class="stat-value" id="stat-kpm">0</span></div>
          <div class="stat"><span class="stat-label">净速</span><span class="stat-value" id="stat-netkpm">0</span></div>
          <div class="stat"><span class="stat-label">键准</span><span class="stat-value" id="stat-accuracy">100%</span></div>
          <div class="stat"><span class="stat-label">回改</span><span class="stat-value" id="stat-backspaces">0</span></div>
          <div class="stat"><span class="stat-label">错字</span><span class="stat-value" id="stat-errors">0</span></div>
          <div class="stat"><span class="stat-label">进度</span><span class="stat-value" id="stat-progress">0/0</span></div>
        </div>
      </section>

      <!-- 设置折叠（左上下方） -->
      <section class="panel">
        <details id="settings-panel">
          <summary>⚙ 设置</summary>
          <div class="settings-grid">
            <label>键盘布局
              <select id="layout-select"></select>
            </label>
            <label>提示码表
              <select id="codetable-select"></select>
            </label>
            <label class="checkbox-line">指法着色
              <input type="checkbox" id="finger-color" checked>
            </label>
            <label class="checkbox-line">显示码表提示
              <input type="checkbox" id="show-code-hint" checked>
            </label>
            <label class="checkbox-line">显示字根拆分
              <input type="checkbox" id="show-chaifen" checked>
            </label>
            <label class="checkbox-line" title="将码表编码翻译为当前键盘布局的按键序列（星陈默认开；灵铭编码原生为 Gallman 键位，默认关）">码表翻译到布局
              <input type="checkbox" id="translate-code" checked>
            </label>
          </div>
          <div class="settings-actions">
            <button id="btn-manage-layouts" class="secondary outline">管理布局</button>
            <button id="btn-import-codetable" class="secondary outline">导入码表</button>
          </div>
          <input type="file" id="codetable-file" accept=".txt,.dict" hidden>
        </details>
      </section>

      <!-- 历史记录（左下） -->
      <section id="history-section" class="panel">
        <div class="panel-title">
          历史记录
          <button id="btn-clear-history" class="secondary outline btn-tiny">清空</button>
        </div>
        <div class="history-scroll">
          <table>
            <thead>
              <tr><th>时间</th><th>文本</th><th>KPM</th><th>键准</th><th>错字率</th><th>回改</th></tr>
            </thead>
            <tbody id="history-body"></tbody>
          </table>
        </div>
      </section>
    </aside>

    <!-- ===== 右侧主体 ===== -->
    <main class="main-content">
      <nav class="platform-nav" aria-label="练习模块">
        <a href="#/typing" data-platform-route="typing">文章跟打</a>
        <a href="#/roots" data-platform-route="roots">字根记忆</a>
        <span class="platform-route-placeholder">拆分练习 · 单字编码（即将开放）</span>
      </nav>

      <!-- 字根记忆区（独立于跟打输入生命周期） -->
      <section id="root-section" class="card root-practice" hidden>
        <div class="root-practice-header">
          <div>
            <h2>字根记忆</h2>
            <p class="muted">看字根回忆键位，逐步进入完整根码。</p>
          </div>
          <div id="root-session-stats" class="root-session-stats"></div>
        </div>
        <div class="root-practice-controls">
          <label>输入方案<select id="root-scheme-select"></select></label>
          <label>练习模式<select id="root-mode-select"></select></label>
          <label>练习范围<select id="root-range-select"></select></label>
          <label id="root-key-label">键位<select id="root-key-select"></select></label>
          <label>题量<input id="root-count" type="number" min="1" max="200" value="20"></label>
          <button id="root-start">开始练习</button>
        </div>
        <div id="root-feedback" class="root-feedback" role="status"></div>
        <div id="root-teaching-card" class="root-teaching-card" hidden>
          <div class="root-teaching-label">先看一眼，再闭卷回忆</div>
          <div id="root-teach-root" class="root-teach-root"></div>
          <div id="root-teach-code" class="root-teach-code"></div>
          <p id="root-teach-hint"></p>
          <button id="root-teaching-continue">开始回忆</button>
        </div>
        <div id="root-question" class="root-question" hidden>
          <div id="root-progress" class="root-progress"></div>
          <div id="root-question-mode" class="root-question-mode"></div>
          <div id="root-question-label" class="root-question-label" aria-live="polite"></div>
          <div id="root-typed" class="root-typed"></div>
          <div id="root-answer" class="root-answer" aria-live="polite"></div>
          <p class="root-help">按对应键位作答；按空格或 Esc 查看答案（计错）。</p>
        </div>
        <div id="root-result" class="root-result" hidden></div>
      </section>

      <!-- 跟打区（含文本选择，紧凑布局） -->
      <section id="typing-section" class="card typing-card">
        <div class="typing-bar">
          <div class="typing-left">
            <details id="text-select-panel" class="text-select-panel">
              <summary id="btn-select-text-summary">📄 跟打文本 <span class="current-text-name" id="current-text-name"></span></summary>
              <div class="text-select-dropdown">
                <div id="text-list" class="text-list"></div>
                <details id="text-import-panel">
                  <summary>＋ 导入自定义文本</summary>
                  <textarea id="text-import-area" rows="2" placeholder="粘贴文本，支持换行/分段"></textarea>
                  <div class="import-actions">
                    <button id="btn-save-text">保存文本</button>
                    <input type="file" id="text-file" accept=".txt" hidden>
                    <button id="btn-upload-text" class="secondary outline">上传 .txt 文件</button>
                  </div>
                </details>
              </div>
            </details>
            <button id="btn-restart" class="outline btn-tiny">重新开始</button>
          </div>
          <span class="typing-pagination" id="typing-pagination"></span>
          <label class="page-size-select">
            每页
            <select id="page-size-select">
              <option value="10">10</option>
              <option value="20" selected>20</option>
              <option value="50">50</option>
              <option value="0">全部</option>
            </select>
          </label>
        </div>
        <div class="typing-area" id="typing-area" tabindex="0">
          <div id="typed-text" class="typed-text"></div>
        </div>
        <div class="code-hint" id="code-hint"></div>
      </section>

      <!-- 虚拟键盘（右侧下方，占剩余空间） -->
      <section id="keyboard-section" class="card">
        <h2>虚拟键盘</h2>
        <div id="virtual-keyboard" class="virtual-keyboard"></div>
      </section>
    </main>
  </div>

  <footer class="app-footer">
    <small>形码练习平台 · MIT License · 内置宇浩星陈 / 灵铭方案</small>
  </footer>

  <!-- 布局编辑器模态框 -->
  <dialog id="layout-editor">
    <article>
      <header><h2>布局编辑器</h2></header>
      <div id="layout-editor-content"></div>
      <footer>
        <button id="btn-layout-save">保存布局</button>
        <button id="btn-layout-close" class="secondary">关闭</button>
      </footer>
    </article>
  </dialog>

  <script type="module" src="assets/js/main.js?v=37-74ee742"></script>
</body>
</html>
